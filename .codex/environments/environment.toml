# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "newman-labs"

[setup]
script = ""

[setup.darwin]
script = '''
set -euo pipefail

current_worktree="$(git rev-parse --show-toplevel)"
local_checkout="$(git worktree list --porcelain | awk '/^worktree / { print substr($0, 10); exit }')"

git config checkout.defaultRemote origin
git config worktree.guessRemote true

if [ ! -f .env ] && [ "$local_checkout" != "$current_worktree" ] && [ -f "$local_checkout/.env" ]; then
  cp "$local_checkout/.env" ./.env
fi

unset VIRTUAL_ENV
uv sync --locked --all-groups
uv run library-skills --all --yes

if [ -f frontend/package.json ]; then
  if [ -d /opt/homebrew/opt/node@24/bin ]; then
    export PATH="/opt/homebrew/opt/node@24/bin:$PATH"
  fi
  (cd frontend && corepack npm install)
fi
'''

[[actions]]
name = "Check Python"
icon = "tool"
command = '''
uv run --locked ruff format --check .
uv run --locked ruff check .
uv run --locked ty check --error all
uv run --locked pytest -m "not integration"
'''

[[actions]]
name = "Install Dependencies"
icon = "tool"
command = '''
uv sync --locked --all-groups
uv run library-skills --all --yes
if [ -f frontend/package.json ]; then
  if [ -d /opt/homebrew/opt/node@24/bin ]; then
    export PATH="/opt/homebrew/opt/node@24/bin:$PATH"
  fi
  (cd frontend && corepack npm install)
fi
'''

[[actions]]
name = "Check dbt"
icon = "tool"
command = '''
uv run --locked python -m libs.dbt.scripts.run_dbt parse
'''

[[actions]]
name = "Check Prefect Cloud"
icon = "tool"
command = '''
set -a
source .env
set +a
uv run --locked prefect config validate
uv run --locked prefect deployment ls
'''
