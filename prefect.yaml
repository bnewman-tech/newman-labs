---
name: newman-labs
prefect-version: 3.8.3

build: null
push: null

pull:
  - prefect.deployments.steps.run_shell_script:
      id: get-github-token
      script: |
        python -m pip install --disable-pip-version-check --no-cache-dir --quiet uv==0.12.5
        uvx --from prefect-cloud==0.1.13 prefect-cloud github token bnewman-tech/newman-labs
      stream_output: false
  - prefect.deployments.steps.git_clone:
      id: git-clone
      repository: https://github.com/bnewman-tech/newman-labs.git
      commit_sha: "{{ $GITHUB_SHA }}"
      credentials:
        username: x-access-token
        access_token: "{{ get-github-token.stdout }}"
  - prefect.deployments.steps.run_shell_script:
      directory: "{{ git-clone.directory }}"
      script: |
        uv export --locked --no-dev --no-emit-project --output-file /tmp/requirements.txt
        uv pip install --system --torch-backend cpu --requirements /tmp/requirements.txt

definitions:
  work_pool: &managed_work_pool
    name: "{{ prefect.variables.serverless_work_pool_name }}"
    work_queue_name: default
    job_variables:
      image: prefecthq/prefect-client:3-python3.13

deployments:
  - name: invoice-extraction-dev
    version: "{{ $GITHUB_SHA }}"
    description: Process development invoice uploads on isolated managed compute.
    tags:
      - newman-labs
      - invoice-parser
      - document-intelligence
      - dev
    entrypoint: labs/invoice_parser/scripts/extract.py:run_managed_invoice_extraction
    parameters:
      environment: dev
    enforce_parameter_schema: true
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
      grace_period_seconds: 300
    schedules: []
    work_pool: *managed_work_pool

  - name: invoice-extraction-prod
    version: "{{ $GITHUB_SHA }}"
    description: Process public invoice uploads on isolated managed compute.
    tags:
      - newman-labs
      - invoice-parser
      - document-intelligence
      - prod
    entrypoint: labs/invoice_parser/scripts/extract.py:run_managed_invoice_extraction
    parameters:
      environment: prod
    enforce_parameter_schema: true
    concurrency_limit:
      limit: 2
      collision_strategy: CANCEL_NEW
      grace_period_seconds: 300
    schedules: []
    work_pool: *managed_work_pool

  - name: houston-311-daily-prod
    version: "{{ $GITHUB_SHA }}"
    description: Ingest Houston 311 into the production database.
    tags:
      - newman-labs
      - houston-signal
      - prod
      - houston-311
    entrypoint: labs/houston_signal/integrations/houston_311/scripts/ingest.py:run_houston_311_pipeline
    parameters:
      environment: prod
    enforce_parameter_schema: true
    schedules:
      - cron: "30 5 * * *"
        timezone: America/Chicago
        active: true
    work_pool: *managed_work_pool

  - name: houston-emergency-center-active-incidents-prod
    version: "{{ $GITHUB_SHA }}"
    description: Retain observed Houston Emergency Center incidents for 365 days.
    tags:
      - newman-labs
      - houston-signal
      - prod
      - houston_emergency_center
    entrypoint: labs/houston_signal/integrations/houston_emergency_center/scripts/ingest.py:run_houston_emergency_center_pipeline
    parameters:
      environment: prod
    enforce_parameter_schema: true
    schedules:
      - cron: "0 6 * * *"
        timezone: America/Chicago
        active: true
    work_pool: *managed_work_pool

  - name: document-retention-cleanup-prod
    version: "{{ $GITHUB_SHA }}"
    description: Delete expired private objects and document records.
    tags:
      - newman-labs
      - document-intelligence
      - prod
    entrypoint: libs/document_intelligence/scripts/cleanup.py:run_document_retention_cleanup
    parameters:
      environment: prod
    enforce_parameter_schema: true
    schedules:
      - cron: "30 4 * * *"
        timezone: America/Chicago
        active: true
    work_pool: *managed_work_pool
