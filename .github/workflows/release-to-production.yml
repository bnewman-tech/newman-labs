name: Release to Production
run-name: Release Newman Labs (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-to-production
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare draft release
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main, not $GITHUB_REF" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "The selected commit is no longer the head of main" >&2
            exit 1
          fi

          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          mapfile -t current_tags < <(
            git tag --points-at HEAD --list 'v*' --sort=-version:refname
          )
          if (( ${#current_tags[@]} > 1 )); then
            echo "The release commit has multiple version tags" >&2
            exit 1
          fi

          if (( ${#current_tags[@]} == 1 )); then
            tag="${current_tags[0]}"
            if [[ ! "$tag" =~ $version_pattern ]]; then
              echo "The release commit has invalid version tag $tag" >&2
              exit 1
            fi
            release_is_draft="$(
              gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true
            )"
            if [[ "$release_is_draft" == "false" ]]; then
              echo "$tag is already published" >&2
              exit 1
            elif [[ "$release_is_draft" == "true" ]]; then
              echo "Reusing draft release $tag"
            fi
          else
            latest_tag="$(
              git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-version:refname | head -n 1
            )"
            if [[ ! "$latest_tag" =~ $version_pattern ]]; then
              echo "The latest version tag is missing or invalid: $latest_tag" >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            case "$BUMP" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unsupported version increment: $BUMP" >&2
                exit 1
                ;;
            esac
            tag="v${major}.${minor}.${patch}"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              > /dev/null
            release_is_draft=""
          fi

          if [[ -z "$release_is_draft" ]]; then
            gh release create "$tag" \
              --draft \
              --fail-on-no-commits \
              --generate-notes \
              --verify-tag
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.prepare.outputs.tag }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: prod
      url: https://labs.briannewman.info
    permissions:
      contents: read

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify release commit is on main
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: false
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --locked --no-dev --group analytics-release

      - name: Apply managed database migrations
        env:
          ENVIRONMENT: prod
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
        run: uv run --no-sync python -m libs.database.scripts.migrate_managed

      - name: Build managed analytics
        env:
          ENVIRONMENT: prod
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
        run: uv run --no-sync python -m libs.dbt.scripts.run_dbt --managed build

      - name: Deploy Prefect definitions
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
        run: |
          : "${PREFECT_API_URL:?PREFECT_API_URL is required}"
          : "${PREFECT_API_KEY:?PREFECT_API_KEY is required}"
          uv run --no-sync python -m libs.prefect_utils.deployments.scripts.deploy

      - name: Deploy Newman Labs to FastAPI Cloud
        env:
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          FASTAPI_CLOUD_DISABLE_VERSION_CHECK: "1"
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
        run: uv run --no-sync fastapi deploy

      - name: Verify Newman Labs production
        run: |
          wait_for_content() {
            url="$1"
            expected="$2"
            for _ in {1..10}; do
              if body="$(curl --fail --silent --show-error "$url")" \
                && grep --fixed-strings --quiet "$expected" <<< "$body"; then
                return 0
              fi
              sleep 6
            done
            return 1
          }
          wait_for_content \
            https://labs.briannewman.info/health/live \
            '"environment":"prod"'
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors \
            https://labs.briannewman.info/health/ready
          wait_for_content \
            https://labs.briannewman.info/houston-signal/ \
            "Houston Signal"
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors \
            "https://labs.briannewman.info/houston-signal/data/map?days=7"
          wait_for_content \
            https://labs.briannewman.info/invoice-parser/ \
            "Supplier match"
          wait_for_content \
            https://labs.briannewman.info/invoice-parser/presentation/ \
            "Tools use typed dependencies"
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors \
            https://labs.briannewman.info/static/demos/invoice-supplier-match.pdf \
            > /dev/null
          wait_for_content \
            https://labs.briannewman.info/static/demos/invoice-supplier-match.json \
            '"supplier_id": "SUP-3007"'
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors \
            https://labs.briannewman.info/static/css/site.css \
            > /dev/null

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          tag_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq .object.sha
          )"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$TAG moved from $GITHUB_SHA to $tag_sha" >&2
            exit 1
          fi
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"
